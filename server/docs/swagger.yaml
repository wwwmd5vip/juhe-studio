  title: Juhe Management API
  version: "1.0"
paths:
  /api/audit-logs:
    get:
      consumes:
      - application/json
      parameters:
      - default: 1
        description: 页码
        in: query
        name: page
        type: integer
      - default: 20
        description: 每页数量
        in: query
        name: page_size
        type: integer
      - description: 操作人 ID
        in: query
        name: operator_id
        type: integer
      - description: 操作人用户名
        in: query
        name: operator_name
        type: string
      - description: 操作类型
        in: query
        name: action
        type: string
      - description: 目标类型
        in: query
        name: target_type
        type: string
      - description: 开始日期 YYYY-MM-DD
        in: query
        name: start_date
        type: string
      - description: 结束日期 YYYY-MM-DD
        in: query
        name: end_date
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/dto.Response'
            - properties:
                data:
                  $ref: '#/definitions/dto.PagedResponse'
              type: object
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.Response'
      security:
      - Bearer: []
      summary: 获取管理操作审计日志
      tags:
      - AuditLogs
